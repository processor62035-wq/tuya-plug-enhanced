name: switch-power-energy-ste
components:
  - id: main
    capabilities:
      - id: switch
        version: 1
      - id: powerMeter
        version: 1
      - id: voltageMeasurement
        version: 1
      - id: currentMeasurement
        version: 1
      - id: energyMeter
        version: 1
      - id: powerConsumptionReport
        version: 1
      - id: refresh
        version: 1
      - id: alarm
        version: 1
    categories:
      - name: SmartPlug
preferences:
  - name: powerPolling
    title: "전력 자동 조회"
    description: "전력값을 주기적으로 조회합니다."
    required: true
    preferenceType: enumeration
    definition:
      options:
        p0: "자동 (기본값)"
        p1: "전력 조회 강제 사용"
        p2: "전력 조회 사용안함"
      default: p0
  - name: energyPolling
    title: "에너지 소비 강제 조회"
    description: "누적 에너지값을 5분마다 조회합니다."
    required: true
    preferenceType: boolean
    definition:
      default: false
  - name: powerPollingMode
    title: "전력 갱신 주기"
    description: "전력값 자동 조회 주기를 선택합니다."
    required: true
    preferenceType: enumeration
    definition:
      options:
        variable_5_15: "가변 (5~15초)"
        variable_5_30: "가변 (5~30초)"
        fixed_10: "10초, 고정"
        fixed_30: "30초, 고정"
        fixed_60: "60초, 고정"
        fixed_300: "300초, 고정"
        manual: "수동 갱신"
      default: variable_5_15
  - name: energyPollingInterval
    title: "에너지 폴링 주기 (초)"
    description: "누적 에너지값을 읽는 주기입니다. 기본값 60초."
    required: true
    preferenceType: integer
    definition:
      minimum: 10
      maximum: 600
      default: 60
  - name: electricalReportInterval
    title: "전압·전류·전력 보고 주기 (초)"
    description: "장치에 전압·전류·전력 보고 주기를 요청합니다. 기본값 5초."
    required: true
    preferenceType: integer
    definition:
      minimum: 1
      maximum: 60
      default: 5
  - name: voltageMode
    title: "전압값 방식"
    description: "전압 센서값을 사용하거나 고정 전압을 사용합니다."
    required: true
    preferenceType: enumeration
    definition:
      options:
        auto: "센서 우선, 없으면 고정값"
        fixed: "고정값 사용"
      default: auto
  - name: voltagePreset
    title: "고정 전압 선택"
    description: "전압 센서가 없을 때 사용할 전압입니다. 자동은 한국 기본값 220V를 사용합니다."
    required: true
    preferenceType: enumeration
    definition:
      options:
        auto: "자동 (한국 기본값 220V)"
        "100": "100V"
        "110": "110V"
        "220": "220V"
        "230": "230V"
      default: auto
  - name: voltageAlarmEnabled
    title: "전압 이상 즉시 경보"
    description: "전압이 평균 기준을 벗어나면 지속 시간과 관계없이 즉시 경보 상태를 발생시킵니다."
    required: true
    preferenceType: boolean
    definition:
      default: true
  - name: voltageAlarmTolerance
    title: "전압 경보 허용 범위"
    description: "최근 정상 전압 평균값을 기준으로 허용할 범위입니다."
    required: true
    preferenceType: enumeration
    definition:
      options:
        "5": "평균값의 ±5%"
        "10": "평균값의 ±10%"
      default: "10"
  - name: voltageAlarmMode
    title: "전압 이상 알람 방식"
    description: "설정 범위를 벗어났을 때 사용할 알람 방식입니다. 자동 차단 직전에는 사이렌이 우선합니다."
    required: true
    preferenceType: enumeration
    definition:
      options:
        off: "꺼짐"
        strobe: "스트로브"
        both: "사이렌 및 스트로브"
        siren: "사이렌"
      default: strobe
  - name: voltageAutoOffEnabled
    title: "전압 이상 자동 차단"
    description: "평균값 대비 ±15% 이상이 15초 지속되면 차단하고, ±20% 이상이면 즉시 차단합니다."
    required: true
    preferenceType: boolean
    definition:
      default: true
