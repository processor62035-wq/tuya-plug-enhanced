      - component: main
        capability: voltageMeasurement
        version: 1
      - component: main
        capability: currentMeasurement
        version: 1
      - component: main
        capability: energyMeter
        version: 1
      - component: main
        capability: powerConsumptionReport
        version: 1
      - component: main
        capability: alarm
        version: 1
    actions:
      - component: main
        capability: switch
        version: 1
